name: Monitor SEFAZ-AM

on:
  workflow_dispatch:
  repository_dispatch:
    types: [atualizar-monitor]

permissions:
  contents: write

concurrency:
  group: monitor-sefaz-am
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar monitor
        run: python monitor_runner.py

      - name: Salvar dados atualizados
        shell: bash
        run: |
          git config user.name "sefaz-monitor"
          git config user.email "actions@github.com"
          git add dados.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza dados do Monitor SEFAZ-AM + SEMEF"
          git pull --rebase origin main
          git push origin HEAD:main
