name: Teste temporário do Monitor

on:
  push:
    paths:
      - ".github/workflows/test-monitor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar teste integrado
        run: python test_monitor_temp.py

      - name: Salvar dados validados e relatório
        if: always()
        shell: bash
        run: |
          if [ ! -f test-results.json ]; then
            echo '{"ok":false,"erro":"O teste não gerou relatório."}' > test-results.json
          fi

          git config user.name "monitor-test"
          git config user.email "actions@github.com"
          git add dados.json test-results.json

          if git diff --cached --quiet; then
            echo "Sem alterações para salvar."
          else
            git commit -m "Aplica resultado validado do Monitor SEFAZ-AM + SEMEF"
            git push
          fi
