# disparo do reteste
name: Reteste atualização
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/test-update-button2.yml"
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Testar botão e publicação
        run: |
          python - <<'PY'
          import json,time,requests
          W='https://monitor-sefaz-am.8dryc8ph6w.workers.dev'
          R='https://raw.githubusercontent.com/Rclo29/Monitor-sefaz-am/main/dados.json'
          def dados():
              x=requests.get(R+'?t='+str(time.time_ns()),timeout=20); x.raise_for_status(); return x.json()
          antes=dados(); a=antes.get('ultima_verificacao','')
          rel={'antes':a,'ok':False}
          r=requests.post(W,json={'acao':'atualizar'},timeout=30)
          rel['worker_status']=r.status_code; rel['worker_body']=r.text[:2000]
          if r.status_code==200:
              fim=time.time()+150
              while time.time()<fim:
                  time.sleep(5); d=dados(); b=d.get('ultima_verificacao','')
                  if b and b!=a:
                      rel['depois']=b; rel['total']=d.get('total_processos'); rel['erros']=d.get('erros'); rel['nao_atualizados']=d.get('processos_nao_atualizados'); rel['tempo_excedido']=d.get('tempo_excedido'); rel['ok']=d.get('total_processos')==29 and int(d.get('erros') or 0)==0 and int(d.get('processos_nao_atualizados') or 0)==0 and d.get('tempo_excedido') is False; break
          open('test-update-results2.json','w',encoding='utf-8').write(json.dumps(rel,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rel,ensure_ascii=False,indent=2))
          PY
      - name: Salvar relatório
        if: always()
        run: |
          git config user.name monitor-test
          git config user.email actions@github.com
          git add test-update-results2.json
          git diff --cached --quiet || (git commit -m "Registra reteste do botão" && git push)
