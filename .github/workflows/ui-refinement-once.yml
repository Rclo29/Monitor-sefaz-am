name: Refinamento visual do Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-refinement-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refinar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajustes no index
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado: {label}")
              text = text.replace(old, new, 1)

          # 1) Nome superior: SEFAZ-AM -> SEFAZ somente no status do topo.
          replace_once(
              '''              <span class="status-name">\n                SEFAZ-AM\n              </span>''',
              '''              <span class="status-name">\n                SEFAZ\n              </span>''',
              "nome SEFAZ no topo",
          )

          # 2) Faixa azul: mostrar contagem por órgão, sem repetir data/hora.
          replace_once(
              '''      <span class="header-stat-label">\n        Processos cadastrados\n      </span>\n\n      <span\n        class="header-stat-value"\n        id="headerTotal"\n      >\n        —\n      </span>''',
              '''      <span class="header-stat-label">\n        Processos SEFAZ\n      </span>\n\n      <span\n        class="header-stat-value"\n        id="headerSefaz"\n      >\n        —\n      </span>''',
              "contador SEFAZ",
          )

          replace_once(
              '''      <span class="header-stat-label">\n        Última verificação\n      </span>\n\n      <span\n        class="header-stat-value"\n        id="headerChecked"\n      >\n        —\n      </span>''',
              '''      <span class="header-stat-label">\n        Processos SEMEF\n      </span>\n\n      <span\n        class="header-stat-value"\n        id="headerSemef"\n      >\n        —\n      </span>''',
              "contador SEMEF",
          )

          # 3) Cor intermediária para fonte externa indisponível/instável.
          replace_once(
              '''    .status-light.offline {\n      background: var(--vermelho);\n\n      box-shadow:\n        0 0 0 3px rgba(201,52,52,.12);\n    }''',
              '''    .status-light.offline {\n      background: var(--vermelho);\n\n      box-shadow:\n        0 0 0 3px rgba(201,52,52,.12);\n    }\n\n    .status-light.unavailable {\n      background: var(--laranja);\n\n      box-shadow:\n        0 0 0 3px rgba(217,119,6,.14);\n    }''',
              "luz indisponível",
          )

          replace_once(
              '''    .status-value.offline {\n      color: var(--vermelho);\n    }''',
              '''    .status-value.offline {\n      color: var(--vermelho);\n    }\n\n    .status-value.unavailable {\n      color: var(--laranja);\n    }''',
              "texto indisponível",
          )

          # 4) Status agora aceita online / unavailable / offline e rótulo específico.
          old_status = '''  function setSourceStatus(\n    source,\n    online\n  ) {\n\n    const light =\n      document.getElementById(\n        `${source}Light`\n      );\n\n    const text =\n      document.getElementById(\n        `${source}StatusText`\n      );\n\n    if (\n      !light\n      ||\n      !text\n    ) {\n\n      return;\n\n    }\n\n    light.classList\n      .remove(\n        "online",\n        "offline"\n      );\n\n    text.classList\n      .remove(\n        "online",\n        "offline"\n      );\n\n    const state =\n      online\n      ?\n      "online"\n      :\n      "offline";\n\n    light.classList\n      .add(\n        state\n      );\n\n    text.classList\n      .add(\n        state\n      );\n\n    text.textContent =\n      online\n      ?\n      "on-line"\n      :\n      "off-line";\n\n  }'''

          new_status = '''  function setSourceStatus(\n    source,\n    state,\n    label = ""\n  ) {\n\n    const light =\n      document.getElementById(\n        `${source}Light`\n      );\n\n    const text =\n      document.getElementById(\n        `${source}StatusText`\n      );\n\n    if (\n      !light\n      ||\n      !text\n    ) {\n\n      return;\n\n    }\n\n    light.classList\n      .remove(\n        "online",\n        "offline",\n        "unavailable"\n      );\n\n    text.classList\n      .remove(\n        "online",\n        "offline",\n        "unavailable"\n      );\n\n    const normalizedState =\n      ["online", "offline", "unavailable"].includes(state)\n      ? state\n      : "offline";\n\n    light.classList.add(normalizedState);\n    text.classList.add(normalizedState);\n\n    text.textContent =\n      label\n      ||\n      (normalizedState === "online"\n        ? "on-line"\n        : normalizedState === "unavailable"\n          ? "indisponível"\n          : "off-line");\n\n  }'''

          replace_once(old_status, new_status, "função setSourceStatus")

          old_sources = '''    const sefazOnline =\n      sefazProcesses.length > 0\n      &&\n      sefazProcesses.some(\n        process =>\n          !isNotUpdated(\n            process\n          )\n      );\n\n    const semefOnline =\n      semefProcesses.length > 0\n      &&\n      semefProcesses.some(\n        process =>\n          !isNotUpdated(\n            process\n          )\n      );\n\n    setSourceStatus(\n      "sefaz",\n      sefazOnline\n    );\n\n    setSourceStatus(\n      "semef",\n      semefOnline\n    );'''

          new_sources = '''    const sefazOk =\n      sefazProcesses.filter(\n        process => !isNotUpdated(process)\n      ).length;\n\n    const sefazErro =\n      sefazProcesses.length - sefazOk;\n\n    const semefOk =\n      semefProcesses.filter(\n        process => !isNotUpdated(process)\n      ).length;\n\n    const semefErro =\n      semefProcesses.length - semefOk;\n\n    if (sefazProcesses.length === 0) {\n      setSourceStatus("sefaz", "offline");\n    } else if (sefazErro > 0 && sefazOk > 0) {\n      setSourceStatus("sefaz", "unavailable", "instável");\n    } else if (sefazErro > 0) {\n      setSourceStatus("sefaz", "unavailable", "indisponível");\n    } else {\n      setSourceStatus("sefaz", "online");\n    }\n\n    if (semefProcesses.length === 0) {\n      setSourceStatus("semef", "offline");\n    } else if (semefErro > 0 && semefOk > 0) {\n      setSourceStatus("semef", "unavailable", "instável");\n    } else if (semefErro > 0) {\n      setSourceStatus("semef", "unavailable", "indisponível");\n    } else {\n      setSourceStatus("semef", "online");\n    }'''

          replace_once(old_sources, new_sources, "lógica de status das fontes")

          # 5) Atualizar contagens da faixa azul por origem.
          old_header = '''    document\n      .getElementById(\n        "headerTotal"\n      )\n      .textContent =\n        processNumbers.length;'''

          new_header = '''    const totalSefaz =\n      processes.filter(\n        process => process.origem === "sefaz"\n      ).length;\n\n    const totalSemef =\n      processes.filter(\n        process => process.origem === "semef"\n      ).length;\n\n    document\n      .getElementById(\n        "headerSefaz"\n      )\n      .textContent =\n        totalSefaz;\n\n    document\n      .getElementById(\n        "headerSemef"\n      )\n      .textContent =\n        totalSemef;'''

          replace_once(old_header, new_header, "contadores do cabeçalho")

          old_checked = '''    const checked =\n      firstValue(\n        rawData,\n        [\n          "ultima_verificacao",\n          "ultima_atualizacao",\n          "updated_at"\n        ],\n        ""\n      );\n\n'''
          replace_once(old_checked, "", "variável checked")

          old_checked_render = '''    document\n      .getElementById(\n        "headerChecked"\n      )\n      .textContent =\n        formatDateTime(\n          checked\n        );\n\n'''
          replace_once(old_checked_render, "", "render headerChecked")

          # Chamadas de erro de carregamento continuam vermelhas como erro do monitor.
          text = text.replace('''      setSourceStatus(\n        "sefaz",\n        false\n      );''', '''      setSourceStatus(\n        "sefaz",\n        "offline"\n      );''')
          text = text.replace('''      setSourceStatus(\n        "semef",\n        false\n      );''', '''      setSourceStatus(\n        "semef",\n        "offline"\n      );''')

          path.write_text(text, encoding="utf-8")

      - name: Validar alterações
        shell: bash
        run: |
          grep -q 'id="headerSefaz"' index.html
          grep -q 'id="headerSemef"' index.html
          grep -q '>instável<' <(tr -d '\n' < index.html) || grep -q '"instável"' index.html
          if grep -q 'id="headerChecked"' index.html; then
            echo "headerChecked ainda existe"
            exit 1
          fi

      - name: Salvar e remover workflow temporário
        shell: bash
        run: |
          git config user.name "monitor-ui-bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/ui-refinement-once.yml
          git add index.html
          git commit -m "Refina status e resumo da tela inicial"
          git pull --rebase origin main
          git push origin HEAD:main
