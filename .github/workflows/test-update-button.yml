# reteste 2
name: Teste botão Atualizar processos

on:
  push:
    paths:
      - ".github/workflows/test-update-button.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Testar fluxo completo do botão
        shell: bash
        run: |
          python <<'PY'
          import json
          import time
          import requests
          from datetime import datetime

          WORKER = "https://monitor-sefaz-am.8dryc8ph6w.workers.dev"
          RAW = "https://raw.githubusercontent.com/Rclo29/Monitor-sefaz-am/main/dados.json"

          def carregar_dados():
              r = requests.get(RAW + f"?t={time.time_ns()}", timeout=20)
              r.raise_for_status()
              return r.json()

          antes = carregar_dados()
          marca_antes = antes.get("ultima_verificacao") or antes.get("ultima_atualizacao") or ""

          rel = {
              "inicio": datetime.utcnow().isoformat() + "Z",
              "ultima_verificacao_antes": marca_antes,
              "worker": {},
              "publicacao": {},
              "ok": False,
          }

          try:
              r = requests.post(
                  WORKER,
                  json={"acao": "atualizar"},
                  headers={"Content-Type": "application/json"},
                  timeout=30,
              )
              rel["worker"] = {
                  "status": r.status_code,
                  "body": r.text[:4000],
              }

              try:
                  body = r.json()
              except Exception:
                  body = {}

              if r.status_code == 200 and body.get("ok") is True:
                  limite = time.time() + 150
                  while time.time() < limite:
                      time.sleep(5)
                      atual = carregar_dados()
                      marca = atual.get("ultima_verificacao") or atual.get("ultima_atualizacao") or ""
                      if marca and marca != marca_antes:
                          rel["publicacao"] = {
                              "mudou": True,
                              "ultima_verificacao_depois": marca,
                              "total_processos": atual.get("total_processos"),
                              "erros": atual.get("erros"),
                              "processos_nao_atualizados": atual.get("processos_nao_atualizados"),
                              "tempo_excedido": atual.get("tempo_excedido"),
                              "duracao_segundos": atual.get("duracao_segundos"),
                          }
                          rel["ok"] = (
                              atual.get("total_processos") == 29
                              and int(atual.get("erros") or 0) == 0
                              and int(atual.get("processos_nao_atualizados") or 0) == 0
                              and atual.get("tempo_excedido") is False
                          )
                          break
                  else:
                      rel["publicacao"] = {"mudou": False, "erro": "dados.json não mudou em 150 segundos"}
              else:
                  rel["publicacao"] = {"mudou": False, "erro": "Worker não aceitou a atualização"}
          except Exception as exc:
              rel["erro_teste"] = repr(exc)

          with open("test-update-results.json", "w", encoding="utf-8") as f:
              json.dump(rel, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(json.dumps(rel, ensure_ascii=False, indent=2))
          PY

      - name: Salvar resultado do teste
        if: always()
        shell: bash
        run: |
          git config user.name "monitor-test"
          git config user.email "actions@github.com"
          git add test-update-results.json
          if git diff --cached --quiet; then
            echo "Sem alterações no relatório."
          else
            git commit -m "Registra teste do botão Atualizar processos"
            git push
          fi
